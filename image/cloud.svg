<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradient Mây Nền Phía Sau (Chiều sâu) -->
    <linearGradient id="backCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8becc" />
      <stop offset="100%" stop-color="#6b728e" />
    </linearGradient>

    <!-- Gradient Mây Chính (Khối 3D mượt) -->
    <linearGradient id="mainCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e8ecf8" />
      <stop offset="100%" stop-color="#a0a8cc" />
    </linearGradient>

    <!-- Viền Sáng Rim-Light -->
    <linearGradient id="rimLightGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Điểm Nhấn Tông Ấm Bề Mặt -->
    <linearGradient id="warmHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe1d6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff9aa2" stop-opacity="0" />
    </linearGradient>

    <!-- Bóng Đổ Tự Nhiên (Đã tối ưu cho mọi loại background) -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#141824" flood-opacity="0.2" />
    </filter>

    <!-- Làm Mềm Tua Mây -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <!-- Layer 1: Khối Mây Phía Sau -->
  <g filter="url(#softShadow)" opacity="0.65">
    <path d="M 210 310
             C 170 310, 140 270, 170 230
             C 180 180, 240 160, 290 180
             C 330 130, 420 120, 470 160
             C 520 130, 600 140, 630 190
             C 680 180, 730 220, 710 270
             C 740 310, 710 350, 660 350
             Z" fill="url(#backCloudGrad)" />
  </g>

  <!-- Layer 2: Khối Mây Chính 3D -->
  <g filter="url(#softShadow)">
    <path d="M 180 340
             C 130 340, 100 290, 140 240
             C 140 180, 200 150, 260 170
             C 290 100, 410 90, 470 140
             C 530 90, 620 110, 640 180
             C 700 180, 740 230, 710 290
             C 730 340, 680 380, 620 370
             C 580 390, 230 390, 180 340
             Z" fill="url(#mainCloudGrad)" />

    <!-- Lớp Phủ Viền Sáng -->
    <path d="M 260 170
             C 290 100, 410 90, 470 140
             C 530 90, 620 110, 640 180
             C 590 165, 520 140, 460 165
             C 410 120, 310 125, 260 170 Z" fill="url(#rimLightGrad)" />

    <!-- Gợn Mây Nổi Phía Trước -->
    <path d="M 210 330 
             C 230 280, 310 270, 340 310 
             C 380 270, 460 270, 490 310 
             C 530 290, 600 300, 610 350 
             C 520 385, 270 385, 210 330 Z" 
          fill="#ffffff" opacity="0.35" />

    <!-- Điểm Nhấn Ấm Nhẹ -->
    <path d="M 140 240 C 140 180, 200 150, 260 170 C 230 195, 170 215, 140 240 Z" fill="url(#warmHighlight)" />
  </g>

  <!-- Layer 3: Tua Mây Trôi Lơ Lửng -->
  <g fill="#ffffff" opacity="0.45" filter="url(#softGlow)">
    <ellipse cx="110" cy="350" rx="35" ry="10" />
    <ellipse cx="710" cy="210" rx="28" ry="7" />
    <ellipse cx="200" cy="130" rx="22" ry="5" />
    <ellipse cx="650" cy="380" rx="40" ry="8" />
  </g>
</svg>
